name: docker_based

on:
  push:
    branches: [Ne-nextflow]
  pull_request:
    branches: [Ne-nextflow]

env:
  NXF_VER: "24.04.4"
  TEST_DATA: ${{ github.workspace }}/tests/test_data
  TOOLS_DIR: ${{ github.workspace }}/tools

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: aprilyuzhang/nehub
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends tabix bcftools
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}
      - name: Install SMC++
        shell: bash
        run: |
          conda create -n smcpp --override-channels -c conda-forge -c bioconda \
            python=3.10 smcpp=1.15.4 "setuptools<81" -y
          conda run -n smcpp smc++ version 
      - name: Generate test data
        run: |
          conda create -n msprime-env python=3.11 -y -c conda-forge && \
          conda run -n msprime-env pip install msprime numpy pandas && \
          conda run -n msprime-env python tests/generate_test_data.py \
            --outdir ${{ env.TEST_DATA }} \
            --n_per_pop 3 \
            --seq_length 1_000_000

      - name: Write ci_params.json
        run: |
          cat > /tmp/ci_params.json << EOF
          {
            "method": "GONE,SMCpp,stairway,tskit,PSMC,Relate,Phlash,MSMC",
            "option": {"ref_genome":"${{ env.TEST_DATA }}/test.fa",
                      "ancestral_genome": "${{ env.TEST_DATA }}/test.fa"},
            "GONE":     { "installation_path": "/opt/GONE" },
            "Relate":   { "Relate_path": "/opt/relate",
                         "genMap_dir": "${{ env.TEST_DATA }}/"},
            "stairway": { "easysfs_path": "/opt/easySFS/easySFS.py",
                          "stairway_path": "/opt/stairway_plot_es" }
          }
          EOF

      - name: Run Ne pipeline
        run: |
          nextflow run main.nf \
            -profile github,github_small \
            -params-file /tmp/ci_params.json \
            --input_dir ${{ env.TEST_DATA }} \
            --output_dir ${{ github.workspace }}/tests/output \
            --chromosomes 1 \
            --population_file popLabel.txt

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            tests/output/
            .nextflow.log
          retention-days: 3
