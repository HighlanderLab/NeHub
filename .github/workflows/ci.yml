name: CI

on:
  push:
    branches: [Ne-nextflow]
  pull_request:
    branches: [Ne-nextflow]

env:
  NXF_VER: "24.04.4"
  TOOLS_DIR: ${{ github.workspace }}/tools
  TEST_DATA: ${{ github.workspace }}/tests/test_data

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: validate Nextflow config syntax (fast, no conda needed)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Nextflow config lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}

      - name: Validate config (github profile)
        run: nextflow config -profile github,small

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: set up conda envs, install tools, run all methods
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Run all methods
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # ── Free disk space ──────────────────────────────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet
          df -h

      # ── System packages ───────────────────────────────────────────────────
      # Excludes build deps for smcpp (libgsl0-dev, libgmp-dev, libmpfr-dev)
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            default-jre-headless tabix bcftools wget unzip git \
            python3-dev \
            cmake build-essential zlib1g-dev libbz2-dev liblzma-dev \
            libcurl4-openssl-dev

      # ── Conda setup ───────────────────────────────────────────────────────
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-activate-base: true
          activate-environment: ""

      # ── Conda environments ────────────────────────────────────────────────
      # Mirrors the environment setup in docker/Dockerfile.
      # --name overrides the Eddie-specific prefix: in each yml.
      - name: Create conda environments
        shell: bash -l {0}
        run: |
          conda env create --name basic_Ne --file conf/envs/basic_Ne.yml
          conda env create --name bcftools --file conf/envs/bcftools.yml
          conda env create --name ts_tools --file conf/envs/ts_tools.yml

          # tszip: missing from ts_tools.yml but required by ts_*.py scripts
          conda install -n ts_tools -y -c conda-forge tszip

          # phlash (CPU only — no GPU on GitHub runners)
          conda create -n phlash python=3.10 -y
          conda run -n phlash conda install -c bioconda dinopy -y 
          conda install -n phlash -y -c conda-forge jaxlib jax
          conda run -n phlash pip install phlash --no-build-isolation

          conda clean -afy


      # ── External tool: GONE ───────────────────────────────────────────────
      - name: Download GONE
        run: |
          mkdir -p ${{ env.TOOLS_DIR }}
          git clone --depth 1 https://github.com/esrud/GONE.git \
            ${{ env.TOOLS_DIR }}/GONE
          chmod -R +x ${{ env.TOOLS_DIR }}/GONE/Linux/PROGRAMMES/

      # ── External tool: Relate ─────────────────────────────────────────────
      - name: Build Relate from source
        run: |
          mkdir -p ${{ env.TOOLS_DIR }}
          git clone --depth 1 https://github.com/MyersGroup/relate.git \
            ${{ env.TOOLS_DIR }}/relate_src

          cd ${{ env.TOOLS_DIR }}/relate_src
          rm -rf build && mkdir build && cd build
          cmake ..
          make -j$(nproc)

          # copy binaries to tools/relate
          mkdir -p ${{ env.TOOLS_DIR }}/relate/bin
          cp ${{ env.TOOLS_DIR }}/relate_src/bin/* \
            ${{ env.TOOLS_DIR }}/relate/bin

          # clean up source to save disk space
          rm -rf ${{ env.TOOLS_DIR }}/relate_src/

          echo "Relate built: $(ls ${{ env.TOOLS_DIR }}/relate/)"
      
      - name: Install SMC++
        shell: bash
        run: |
          conda create -n smcpp --override-channels -c conda-forge -c bioconda \
            python=3.10 smcpp=1.15.4 "setuptools<81" -y
          conda run -n smcpp smc++ version 
      # ── External tool: Stairway Plot 2 ────────────────────────────────────
      - name: Download Stairway Plot 2
        run: |
          git clone --depth 1 https://github.com/xiaoming-liu/stairway-plot-v2.git \
            /tmp/stairway_plot_v2_src

          cd /tmp/stairway_plot_v2_src
          unzip -o -q stairway_plot_v2.1.3.zip -d stairway_src   # -o = overwrite

          mv stairway_src/stairway_plot_v2.1.3/stairway_plot_es \
            ${{ env.TOOLS_DIR }}/stairway_plot_es

          rm -rf /tmp/stairway_plot_v2_src
          echo "Stairway installed: $(ls ${{ env.TOOLS_DIR }}/stairway_plot_es/)"

      # ── External tool: easySFS ────────────────────────────────────────────
      - name: Install easySFS
        run: |
          git clone --depth 1 https://github.com/isaacovercast/easySFS.git \
            ${{ env.TOOLS_DIR }}/easySFS
          chmod +x ${{ env.TOOLS_DIR }}/easySFS/easySFS.py

      # ── Generate synthetic test data ──────────────────────────────────────
      - name: Install msprime in ts_tools
        shell: bash -l {0}
        run: |
          conda install -n ts_tools -y -c conda-forge msprime
      - name: Generate test data
        run: |
          conda run -n ts_tools python tests/generate_test_data.py \
                --outdir ${{ env.TEST_DATA }} \
                --n_per_pop 3 \
                --seq_length 1_000_000

      # ── Write ci_params.json ──────────────────────────────────────────────
      - name: Write ci_params.json
        run: |
          cat > /tmp/ci_params.json << EOF
          {
            "method": "GONE,SMCpp,stairway,tskit,PSMC,Relate,Phlash,MSMC",
            "GONE": {
              "installation_path": "${{ env.TOOLS_DIR }}/GONE"
            },
            "Relate": {
              "Relate_path":     "${{ env.TOOLS_DIR }}/relate",
              "ancestral_genome":"${{ env.TEST_DATA }}/test.fa",
              "genMap_dir":      "${{ env.TEST_DATA }}"
            },
            "stairway": {
              "easysfs_path":  "${{ env.TOOLS_DIR }}/easySFS/easySFS.py",
              "stairway_path": "${{ env.TOOLS_DIR }}/stairway_plot_es"
            },
            "PSMC": {
              "ref_genome": "${{ env.TEST_DATA }}/test.fa"
            },
            "tskit": {
              "ancestral_genome": "${{ env.TEST_DATA }}/test.fa"
            }
          }
          EOF
      # ── Install nextflow  ───────────────────────────────────────────────────
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}
      # ── Run all methods ───────────────────────────────────────────────────
      - name: Run Ne pipeline (all methods)
        run: |
          nextflow run main.nf \
            -profile github,github_small \
            -params-file /tmp/ci_params.json \
            --input_dir ${{ env.TEST_DATA }} \
            --output_dir ${{ github.workspace }}/tests/output \
            --chromosomes 1 \
            --population_file popLabel.txt \
            -resume

      # ── Upload outputs for debugging ──────────────────────────────────────
      - name: Upload pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            tests/output/
            .nextflow.log
          retention-days: 3
