restart-times: 0
use-conda: true
jobscript: "jobscript.sh"
cluster-config: "cluster.json"
jobname: "{rule}.{jobid}"
# jobs: 8
drmaa: " -P roslin_HighlanderLab -cwd -l h_vmem={cluster.mem} -l h_rt={cluster.time} -l rl9=false -pe sharedmem {cluster.threads} -R y"
rerun-incomplete: true
rerun-triggers: [mtime, input]
# cores: 8 # how many jobs you want to submit to your cluster queue
local-cores: 99
keep-going: false